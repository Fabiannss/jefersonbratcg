          return;

          if (a.id !== auctionId) return a;

            currentBid: amount,
            bidsCount: a.bidsCount + 1,
            winnerName: `${finalBidder} (Manaus - AM)`,

                      <div className="pt-3 mt-3 border-t border-slate-800 space-y-2">
                        <div className="flex items-baseline justify-between">
                          <span className="text-lg font-black text-yellow-400">R$ {prod.price.toFixed(2).replace(".", ",")}</span>
                          <span className="text-[11px] text-slate-400">{prod.stock} un.</span>
                        </div>
                        <div className="flex gap-2">
                          <button onClick={() => addToCart(prod)} className="flex-1 py-2 rounded-xl bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-black text-xs">
                            Comprar
                          </button>
                          <button onClick={() => { setSelectedProduct(prod); setView("DETAIL"); }} className="px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs font-bold">
                            Detalhes
                          </button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </>
            )}

            {/* DETALHES DO PRODUTO + VÍDEO DE HOLOGRAFIA */}
            {view === "DETAIL" && selectedProduct && (
              <div className="p-6 sm:p-8 rounded-3xl bg-[#121722] border border-slate-800 grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div className="lg:col-span-5 space-y-4">
                  <div className="p-6 rounded-2xl bg-slate-950 flex justify-center">
                    <img src={selectedProduct.images[0]} className="max-h-80 object-contain rounded-xl" />
                  </div>
                  {selectedProduct.videoUrl && (
                    <div className="p-4 rounded-2xl bg-slate-900 border border-cyan-500/30 space-y-2">
                      <span className="text-xs font-extrabold text-cyan-300 block">🎥 Vídeo de Demonstração da Holografia & Estado Real:</span>
                      <video src={selectedProduct.videoUrl} controls autoPlay muted loop className="w-full h-44 object-cover rounded-xl" />
                    </div>
                  )}
                </div>
                <div className="lg:col-span-7 space-y-4">
                  <button onClick={() => setView("HOME")} className="text-xs text-yellow-400 font-bold">← Voltar ao Catálogo</button>
                  <div className="flex gap-2">
                    <span className="px-2.5 py-1 rounded bg-yellow-400/20 text-yellow-300 text-xs font-bold">{selectedProduct.category}</span>
                    <span className="px-2.5 py-1 rounded bg-purple-500/20 text-purple-300 text-xs font-bold">Raridade: {selectedProduct.rarity}</span>
                    <span className="px-2.5 py-1 rounded bg-emerald-500/20 text-emerald-300 text-xs font-bold">Condição: {selectedProduct.condition}</span>
                  </div>
                  <h1 className="text-2xl sm:text-3xl font-black text-white">{selectedProduct.title}</h1>
                  <p className="text-xs text-slate-400">{selectedProduct.setName} • {selectedProduct.rarityDetail}</p>
                  <div className="text-3xl font-black text-yellow-400">R$ {selectedProduct.price.toFixed(2).replace(".", ",")}</div>
                  <p className="text-sm text-slate-300 leading-relaxed">{selectedProduct.description}</p>
                  <div className="p-4 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 text-xs space-y-1">
                    <strong className="text-emerald-300 block">📍 Facilidades de Entrega em Manaus - AM:</strong>
                    <p>• Ponto de Encontro GRÁTIS (Amazonas Shopping, Manauara, Ponta Negra, Sumaúma)</p>
                    <p>• Motoboy Expresso Manaus em até 2h (a partir de R$ 12,00)</p>
                    <p>• Envio Nacional via Correios SEDEX/PAC com embalagem blindada (TopLoader + Sleeve)</p>
                  </div>
                  <button onClick={() => addToCart(selectedProduct)} className="w-full py-4 rounded-2xl bg-yellow-400 text-slate-950 font-black text-sm">
                    Adicionar ao Carrinho
                  </button>
                </div>
              </div>
            )}

            {/* SALA DE LEILÕES EM TEMPO REAL */}
            {view === "AUCTIONS" && (
              <div className="space-y-6">
                <div className="p-6 rounded-3xl bg-gradient-to-r from-red-500/20 to-[#121722] border border-red-500/30">
                  <h1 className="text-2xl sm:text-3xl font-black text-white">🔥 Leilões Pokémon TCG em Tempo Real</h1>
                  <p className="text-xs text-slate-300 mt-1">Contador regressivo ao vivo, lance mínimo automático e retirada gratuita nos shoppings de Manaus.</p>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  {auctions.map(auc => {
                    const minNext = auc.currentBid + auc.minIncrement;
                    return (
                      <div key={auc.id} className="rounded-2xl bg-[#131926] border border-red-500/40 p-5 space-y-4 flex flex-col justify-between">
                        <div className="space-y-3">
                          <div className="flex justify-between items-center text-xs font-extrabold text-red-300 bg-red-500/15 px-3 py-1.5 rounded-xl">
                            <span>⏱ TEMPO RESTANTE:</span>
                            <span className="font-mono">{formatRemaining(auc.endsAt)}</span>
                          </div>
                          <div className="flex gap-3 items-center">
                            <img src={auc.product.images[0]} className="w-20 h-28 object-contain bg-slate-950 rounded-xl p-1" />
                            <div>
                              <h3 className="text-sm font-extrabold text-white">{auc.product.title}</h3>
                              <p className="text-[11px] text-slate-400 mt-0.5">{auc.bidsCount} lances • Líder: {auc.winnerName}</p>
                              <div className="text-xl font-black text-yellow-400 mt-1">R$ {auc.currentBid.toFixed(2).replace(".", ",")}</div>
                            </div>
                          </div>
                        </div>
                        <form
                          onSubmit={e => {
                            e.preventDefault();
                            const val = parseFloat(e.target.elements.bidAmount.value);
                            const name = e.target.elements.bidder.value;
                            placeBid(auc.id, val, name);
                          }}
                          className="space-y-2 pt-3 border-t border-slate-800"
                        >
                          <input name="bidder" placeholder="Seu Nome + Bairro em Manaus" className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white" />
                          <div className="flex gap-2">
                            <input name="bidAmount" type="number" step="1" defaultValue={minNext} className="w-28 px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs font-bold text-yellow-400" />
                            <button type="submit" className="flex-1 py-2 rounded-xl bg-gradient-to-r from-red-500 to-amber-500 text-slate-950 font-black text-xs">
                              Dar Lance (Mín R$ {minNext})
                            </button>
                          </div>
                        </form>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* CHECKOUT MANAUS */}
            {view === "CHECKOUT" && (
              <div className="p-6 sm:p-8 rounded-3xl bg-[#121722] border border-slate-800 space-y-6">
                <h1 className="text-2xl font-black text-white">Checkout & Entrega Facilitada Manaus - AM</h1>
                {cart.length === 0 ? (
                  <p className="text-sm text-slate-400">Seu carrinho está vazio. Adicione Cartas Avulsas ou ETBs Seladas!</p>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div className="space-y-3">
                      <h3 className="text-sm font-bold text-yellow-400">Escolha a Modalidade de Entrega:</h3>
                      <label className="block p-3.5 rounded-xl bg-emerald-500/10 border border-emerald-400 text-xs">
                        <input type="radio" name="deliv" defaultChecked className="mr-2" />
                        <strong>Ponto de Encontro em Manaus (GRÁTIS - R$ 0,00)</strong> — Amazonas Shopping, Manauara, Ponta Negra ou Sumaúma
                      </label>
                      <label className="block p-3.5 rounded-xl bg-slate-900 border border-slate-800 text-xs">
                        <input type="radio" name="deliv" className="mr-2" />
                        <strong>Motoboy Expresso Manaus (R$ 12,00 a R$ 18,00)</strong> — Entrega no mesmo dia em até 2h
                      </label>
                      <label className="block p-3.5 rounded-xl bg-slate-900 border border-slate-800 text-xs">
                        <input type="radio" name="deliv" className="mr-2" />
                        <strong>Correios SEDEX / PAC Nacional Blindado</strong> — Envio para outros estados
                      </label>
                    </div>
                    <div className="space-y-3">
                      <h3 className="text-sm font-bold text-white">Itens no Pedido:</h3>
                      {cart.map(i => (
                        <div key={i.product.id} className="flex justify-between text-xs border-b border-slate-800 pb-2">
                          <span>{i.quantity}x {i.product.title}</span>
                          <strong className="text-yellow-400">R$ {(i.product.price * i.quantity).toFixed(2)}</strong>
                        </div>
                      ))}
                      <button
                        onClick={() => { setCart([]); showToast("Pedido confirmado! Entraremos em contato via WhatsApp em Manaus."); setView("HOME"); }}
                        className="w-full py-3.5 rounded-xl bg-yellow-400 text-slate-950 font-black text-xs"
                      >
                        Finalizar Pedido Agora
                      </button>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* PAINEL ADMIN PROTEGIDO (/admin) */}
            {view === "ADMIN" && (
              <div className="p-6 sm:p-8 rounded-3xl bg-[#121722] border border-purple-500/40 space-y-6">
                {!isAdmin ? (
                  <form
                    onSubmit={e => {
                      e.preventDefault();
                      if (adminPassword === "admin123") { setIsAdmin(true); setAdminError(""); }
                      else setAdminError("Senha incorreta! Use a senha de demonstração: admin123");
                    }}
                    className="max-w-md mx-auto space-y-4 py-6"
                  >
                    <h2 className="text-xl font-black text-white">🔒 Área Restrita do Administrador (/admin)</h2>
                    <p className="text-xs text-slate-400">Digite a senha administrativa (<code className="text-yellow-400">admin123</code>) para gerenciar Cartas Avulsas, ETBs, Fotos Hi-Res, Vídeos de Holografia e Leilões.</p>
                    <input
                      type="password"
                      value={adminPassword}
                      onChange={e => setAdminPassword(e.target.value)}
                      placeholder="Senha (admin123)"
                      className="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white"
                    />
                    {adminError && <p className="text-xs text-red-400 font-bold">{adminError}</p>}
                    <button type="submit" className="w-full py-3 rounded-xl bg-purple-500 text-white font-black text-xs">Desbloquear Painel Admin</button>
                  </form>
                ) : (
                  <div className="space-y-6">
                    <div className="flex justify-between items-center">
                      <h2 className="text-xl font-black text-white">Painel Admin Desbloqueado • Gestão de Catálogo Pokémon TCG</h2>
                      <button onClick={() => setIsAdmin(false)} className="text-xs text-red-400 underline">Bloquear / Sair</button>
                    </div>
                    <form
                      onSubmit={e => {
                        e.preventDefault();
                        const f = e.target.elements;
                        const newProd = {
                          id: "prod-" + Date.now(),
                          title: f.title.value,
                          category: f.category.value,
                          setName: f.setName.value,
                          rarity: f.rarity.value,
                          rarityDetail: f.rarity.value === "RARA" ? "Special Illustration Rare (SIR)" : "Holo / Regular",
                          condition: f.condition.value,
                          price: parseFloat(f.price.value) || 99.90,
                          stock: parseInt(f.stock.value, 10) || 1,
                          description: f.description.value,
                          images: [f.image.value || "https://images.pokemontcg.io/sv8/238_hires.png"],
                          videoUrl: f.videoUrl.value || undefined
                        };
                        setProducts([newProd, ...products]);
                        e.target.reset();
                        showToast("Produto cadastrado no catálogo com sucesso!");
                      }}
                      className="grid grid-cols-1 md:grid-cols-3 gap-3 p-5 rounded-2xl bg-slate-900 border border-slate-800"
                    >
                      <input required name="title" placeholder="Título da Carta ou ETB *" className="px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs" />
                      <select name="category" className="px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs">
                        <option value="SINGLE">Carta Avulsa (Single)</option>
                        <option value="ETB">ETB Selado</option>
                      </select>
                      <select name="rarity" className="px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs">
                        <option value="RARA">Raridade: Rara (SIR / Alt Art / Secreta)</option>
                        <option value="MEDIA">Raridade: Média (Holo / Reverse / Ultra Reg)</option>
                        <option value="BASICA">Raridade: Básica (Comum / Incomum)</option>
                      </select>
                      <input required name="setName" defaultValue="Escarlate e Violeta: Fagulhas Impetuosas" placeholder="Coleção *" className="px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs" />
                      <select name="condition" className="px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs">
                        <option value="NM">Near Mint (NM)</option>
                        <option value="LP">Lightly Played (LP)</option>
                        <option value="SEALED">Lacrado (SEALED)</option>
                      </select>
                      <input required name="price" type="number" step="0.1" placeholder="Preço R$ *" className="px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs text-yellow-400 font-bold" />
                      <input required name="stock" type="number" defaultValue="1" placeholder="Estoque *" className="px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs" />
                      <input name="image" placeholder="URL Foto Alta Resolução" className="px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs" />
                      <input name="videoUrl" placeholder="URL Vídeo Curto Holografia (MP4)" className="px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs" />
                      <textarea name="description" placeholder="Descrição de conservação e textura..." className="md:col-span-2 px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs" />
                      <button type="submit" className="py-2.5 rounded-xl bg-yellow-400 text-slate-950 font-black text-xs">+ Cadastrar Carta / ETB</button>
                    </form>

                    <div className="space-y-2">
                      {products.map(p => (
                        <div key={p.id} className="p-3 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-between text-xs">
                          <span><strong>{p.title}</strong> ({p.category} • {p.rarity} • {p.condition}) — R$ {p.price.toFixed(2)}</span>
                          <button onClick={() => setProducts(products.filter(x => x.id !== p.id))} className="text-red-400 hover:underline font-bold">Excluir</button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
